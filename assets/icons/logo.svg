<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient / Colors -->
    <linearGradient id="silverPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Base Petal Shape -->
    <path id="singlePetal"
          d="M -38,-40
             L -52,-72
             C -6,-114 72,-110 132,-40
             C 86,-65 24,-58 -38,-40 Z" />

    <!-- 24 Spokes for Ashoka Chakra -->
    <g id="spokePair">
      <line x1="0" y1="-14" x2="0" y2="-36" stroke="#002D62" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="14" x2="0" y2="36" stroke="#002D62" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Main Emblem Group -->
  <g transform="translate(240, 240)">

    <!-- ================= 3 SYMMETRIC PETALS ================= -->
    <!-- 1. White / Silver Petal (Left / Top-Left) -->
    <use href="#singlePetal"
         transform="rotate(240)"
         fill="url(#silverPetal)"
         stroke="#94A3B8"
         stroke-width="1.2"
         stroke-linejoin="round" />

    <!-- 2. Saffron / Orange Petal (Top / Top-Right) -->
    <use href="#singlePetal"
         transform="rotate(0)"
         fill="#F46524" />

    <!-- 3. India Green Petal (Bottom / Bottom-Right) -->
    <use href="#singlePetal"
         transform="rotate(120)"
         fill="#138808" />

    <!-- ================= ASHOKA CHAKRA ================= -->
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="37.5" fill="none" stroke="#002D62" stroke-width="3.5" />

    <!-- 24 Spokes (12 pairs rotated every 15 degrees) -->
    <g>
      <use href="#spokePair" transform="rotate(0)" />
      <use href="#spokePair" transform="rotate(15)" />
      <use href="#spokePair" transform="rotate(30)" />
      <use href="#spokePair" transform="rotate(45)" />
      <use href="#spokePair" transform="rotate(60)" />
      <use href="#spokePair" transform="rotate(75)" />
      <use href="#spokePair" transform="rotate(90)" />
      <use href="#spokePair" transform="rotate(105)" />
      <use href="#spokePair" transform="rotate(120)" />
      <use href="#spokePair" transform="rotate(135)" />
      <use href="#spokePair" transform="rotate(150)" />
      <use href="#spokePair" transform="rotate(165)" />
    </g>

    <!-- Hub / Center Circles -->
    <circle cx="0" cy="0" r="14" fill="#002D62" />
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3.5" fill="#002D62" />
  </g>
</svg>
